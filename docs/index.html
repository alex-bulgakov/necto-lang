<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Necto Documentation v1.1.0 — Documentation</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-heading: #f0f6fc;
            --accent: #58a6ff;
            --badge-fn: #238636;
            --badge-struct: #1f6feb;
            --badge-enum: #a371f7;
            --code-bg: #090d13;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        aside {
            width: 320px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header h1 {
            font-size: 1.25rem;
            color: var(--text-heading);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-header .version-tag {
            font-size: 0.75rem;
            background: #21262d;
            padding: 2px 8px;
            border-radius: 12px;
            color: var(--accent);
        }
        .search-box {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
        }
        .search-box input {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.875rem;
            outline: none;
        }
        .search-box input:focus { border-color: var(--accent); }
        .symbol-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .symbol-item {
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2px;
            font-size: 0.875rem;
        }
        .symbol-item:hover { background: #21262d; color: var(--text-heading); }
        .badge {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-Function { background: rgba(35, 134, 54, 0.2); color: #3fb950; border: 1px solid rgba(35,134,54,0.4); }
        .badge-Struct { background: rgba(31, 111, 235, 0.2); color: #58a6ff; border: 1px solid rgba(31,111,235,0.4); }
        .badge-Enum { background: rgba(163, 113, 247, 0.2); color: #bc8cff; border: 1px solid rgba(163,113,247,0.4); }
        main {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .card-title {
            font-size: 1.35rem;
            color: var(--text-heading);
            font-family: monospace;
        }
        .card-file {
            font-size: 0.75rem;
            color: #8b949e;
            margin-left: auto;
        }
        .signature-block {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px 16px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #e6edf3;
            white-space: pre-wrap;
            margin-bottom: 14px;
        }
        .doc-text {
            color: #8b949e;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <aside>
        <div class="sidebar-header">
            <h1>Necto Documentation <span class="version-tag">v1.1.0</span></h1>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search symbols..." autocomplete="off">
        </div>
        <div class="symbol-list" id="symbolList"></div>
    </aside>
    <main id="mainContent">
        <h2 style="margin-bottom: 20px; color: var(--text-heading);">API Reference</h2>
        <div id="cardsList"></div>
    </main>

d":"Enum","Name":"Expr","Signature":"enum Expr {\n    Num(int),\n    Binary(str, Box[Expr], Box[Expr])\n}","Doc":"","File":"10_self_compiler_pipeline.nc"},{"Kind":"Struct","Name":"Lexer","Signature":"struct Lexer {\n    source: str,\n    cursor: int\n}","Doc":"// 1. Лексер со структурой и методами (impl Lexer)","File":"10_self_compiler_pipeline.nc"},{"Kind":"Struct","Name":"Parser","Signature":"struct Parser {\n    tokens: [Token],\n    cursor: int\n}","Doc":"// Пропуск пробельных символов\n// 2. Парсер со структурой и методами (impl Parser)","File":"10_self_compiler_pipeline.nc"},{"Kind":"Struct","Name":"Codegen","Signature":"struct Codegen {\n    temp_var_id: int\n}","Doc":"// 3. Кодогенератор AST -\u003e C код (impl Codegen)","File":"10_self_compiler_pipeline.nc"},{"Kind":"Function","Name":"run_compiler_pipeline","Signature":"fn run_compiler_pipeline(source: str) -\u003e Result[str, str]","Doc":"// 4. Сквозной пайплайн с оператором '?'","File":"10_self_compiler_pipeline.nc"},{"Kind":"Function","Name":"main","Signature":"fn main()","Doc":"","File":"10_self_compiler_pipeline.nc"},{"Kind":"Function","Name":"main","Signature":"fn main()","Doc":"// 11_c_interop.nc\n// Necto v0.7.0-alpha Milestone:\n// Прямой вызов функций Си-библиотек через блоки extern \"C\" (C FFI)","File":"11_c_interop.nc"},{"Kind":"Function","Name":"handle_request","Signature":"fn handle_request(path: str) -\u003e str","Doc":"// 12_http_server.nc\n// Necto v0.9.0-alpha Milestone:\n// Полноценный HTTP веб-сервер и HTTP-клиент на чистом Necto","File":"12_http_server.nc"},{"Kind":"Function","Name":"main","Signature":"fn main()","Doc":"// Запуск локального сервера на порту 8899\n// Выполнение клиентского запроса через http.get","File":"12_http_server.nc"},{"Kind":"Struct","Name":"Point","Signature":"struct Point {\n    x: int,\n    y: int\n}","Doc":"// 13_benchmarks_and_docs.nc\n// Necto v0.10.0-alpha Milestone:\n// Документирование кода (/// doc-комментарии) и замеры производительности (bench)\nСтрук e channel","File":"15_concurrency.nc"},{"Kind":"Function","Name":"greet_task","Signature":"fn greet_task(ch: Channel)","Doc":"Sends a greeting message into a channel","File":"15_concurrency.nc"},{"Kind":"Function","Name":"produce_values","Signature":"fn produce_values(ch: Channel, count: int)","Doc":"Producer: sends N sequential values into a channel, then closes it","File":"15_concurrency.nc"},{"Kind":"Function","Name":"main","Signature":"fn main()","Doc":"","File":"15_concurrency.nc"},{"Kind":"Function","Name":"add","Signature":"fn add(a: int, b: int) -\u003e int","Doc":"// math_utils.nc\n// Модуль вспомогательных математических функций для Necto","File":"math_utils.nc"},{"Kind":"Function","Name":"multiply","Signature":"fn multiply(a: int, b: int) -\u003e int","Doc":"","File":"math_utils.nc"},{"Kind":"Function","Name":"square","Signature":"fn square(x: int) -\u003e int","Doc":"","File":"math_utils.nc"}];
        const searchInput = document.getElementById('searchInput');
        const symbolList = document.getElementById('symbolList');
        const cardsList = document.getElementById('cardsList');

        function render(filter = '') {
            symbolList.innerHTML = '';
            cardsList.innerHTML = '';
            const lower = filter.toLowerCase();

            items.filter(it => it.Name.toLowerCase().includes(lower) || it.Kind.toLowerCase().includes(lower)).forEach((it, idx) => {
                const navItem = document.createElement('div');
                navItem.className = 'symbol-item';
                navItem.innerHTML = '<span>' + it.Name + '</span><span class="badge badge-' + it.Kind + '">' + it.Kind + '</span>';
                navItem.onclick = () => {
                    const el = document.getElementById('item-' + idx);
                    if (el) el.scrollIntoView({ behavior: 'smooth' });
                };
                symbolList.appendChild(navItem);

                const card = document.createElement('div');
                card.className = 'card';
                card.id = 'item-' + idx;
                card.innerHTML = 
                    '<div class="card-header">' +
                        '<span class="badge badge-' + it.Kind + '">' + it.Kind + '</span>' +
                        '<span class="card-title">' + it.Name + '</span>' +
                        '<span class="card-file">' + it.File + '</span>' +
                    '</div>' +
                    '<div class="signature-block">' + it.Signature + '</div>' +
                    '<div class="doc-text">' + (it.Doc ? it.Doc : '<em style="color: #484f58">No documentation provided.</em>') + '</div>';
                cardsList.appendChild(card);
            });
        }

        searchInput.addEventListener('input', (e) => render(e.target.value));
        render();
    </script>
